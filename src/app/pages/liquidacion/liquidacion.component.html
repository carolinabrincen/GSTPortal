<div [id]="'myDiv'" class="content-block dx-card responsive-paddings">
    <br><br>

        <dx-form id="form" [formData]="formFilter">

            <dxi-item itemType="group" cssClass="form-group" [colCount]="3">
                 
                <dxi-item itemType="group">
                    <dxi-item dataField="Fecha" editorType="dxDateBox" [editorOptions]="{ width: '100%', displayFormat:'dd/MM/yyyy' }"></dxi-item>
                </dxi-item>

                <dxi-item itemType="group" class="styleButton">
                    <dx-button stylingMode="contained" text="Buscar" icon="search" type="normal" [width]="120" (onClick)="buscarClick($event)">
                    </dx-button>
                </dxi-item>
                
            </dxi-item>
        </dx-form>
            <br>
    
    <div>

        <!--==============================================PAGOS POR DIA=================================================================================-->
        <dx-data-grid  #gridCartera id="gridContainer2" [dataSource]="liquidacion" [height]="500"[showBorders]="true" [columnAutoWidth]="true"
        (onRowPrepared)="onRowPreparedPXD($event)" (onCellPrepared)="onCellPreparedPXD($event)">

          <dxo-scrolling mode="virtual" rowRenderingMode="virtual"></dxo-scrolling>
          <dxo-paging [pageSize]="100"></dxo-paging>
          <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>
          <dxo-export [enabled]="true" fileName="Liquidación"></dxo-export>
            
            <dxi-column dataField="udn" caption="UdN" [groupIndex]="0"></dxi-column>

            <dxi-column dataField="periodo" caption="Periodo" [fixed]="true"></dxi-column>
            <dxi-column dataField="idPersonal" caption="Cvetra" [fixed]="true"></dxi-column>
            <dxi-column dataField="nombre" caption="Nombre" [fixed]="true"></dxi-column>
            <dxi-column dataField="operacion" caption="Operación" [fixed]="true"></dxi-column>
            
            <dxi-column caption="LIQUIDADO" alignment="center">
              <dxi-column dataField="semana1" caption="Semana 1" [format]="formatValue"></dxi-column>
              <dxi-column dataField="semana2" caption="Semana 2" [format]="formatValue"></dxi-column>
              <dxi-column dataField="semana3" caption="Semana 3" [format]="formatValue" ></dxi-column>
              <dxi-column dataField="semana4" caption="Semana 4" [format]="formatValue"></dxi-column>
              <dxi-column dataField="semana5" caption="Semana 5" [format]="formatValue"></dxi-column>
              <dxi-column dataField="liquidado" caption="Liquidado" [format]="formatValue"></dxi-column> 
            </dxi-column>

            <dxi-column caption="NO LIQUIDADO" alignment="center">
              <dxi-column dataField="kmsCargados" caption="KMS Cargados"></dxi-column>
              <dxi-column dataField="kmsVacios" caption="KMS Vacios"></dxi-column>
              <dxi-column dataField="noLiquidado" caption="No Liquidado" [format]="formatValue"></dxi-column>            
            </dxi-column>

            <dxi-column dataField="total" caption="Total" [format]="formatValue"></dxi-column>


            <dxi-column caption="OBSERVACIONES" alignment="center">
            <dxi-column dataField="observaciones" caption="Observaciones" [width]="400"></dxi-column>
            <dxi-column caption="Agregar" cellTemplate="obsevaciones" alignment="center" [width]="100"></dxi-column>
            <dxi-column caption="Ver" cellTemplate="VerObsevaciones" alignment="center"></dxi-column>
            </dxi-column>
            <dxi-column dataField="" caption="" [width]="15"></dxi-column>


            <div *dxTemplate="let data of 'obsevaciones'">
              <dx-button icon="comment" stylingMode="outlined" type="danger" (onClick)="agregarObs(data)"></dx-button>
            </div>

            <div *dxTemplate="let data of 'VerObsevaciones'">
              <dx-button icon="comment" stylingMode="outlined" type="danger" (onClick)="VerObs(data)"></dx-button>
            </div>

          <dxo-summary>
            <dxi-group-item column="semana1" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="semana2" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="semana3" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="semana4" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="semana5" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="liquidado" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="noLiquidado" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>
            <dxi-group-item column="total" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" [showInGroupFooter]="true" [alignByColumn]="true"></dxi-group-item>

            <dxi-total-item column="semana1" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="semana2" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="semana3" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="semana4" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="semana5" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="liquidado" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="noLiquidado" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
            <dxi-total-item column="total" summaryType="sum" displayFormat="{0}" [valueFormat]="formatValue" ></dxi-total-item>
          </dxo-summary>

        </dx-data-grid>

        <br><br>
    </div>

     <dx-popup width="35%" height="35%" [showTitle]="true" title="Observación" [dragEnabled]="false" [closeOnOutsideClick]="true" [showCloseButton]="true" container=".dx-viewport" [(visible)]="modObservaciones">
        <div *dxTemplate="let data of 'content'">
            <dx-scroll-view width="100%" height="100%">

              <form action="" (submit)="guardarObservacion($event)">
                <dx-form id="form" [(formData)]="formObs" validationGroup="customerData" [readOnly]="bolFormSoloLectura">
                  

                    <dxi-item dataField="observaciones" editorType="dxTextArea" [colSpan]="3">
                            <dxi-validation-rule style="margin-top: 5rem" type="required" message="campo requerido"></dxi-validation-rule>
                    </dxi-item>
                  <dxi-item itemType="group" [colSpan]="2" [colCount]="2">
                    <dxi-item itemType="button" horizontalAlignment="right" [buttonOptions]="buttonOptionsCancelar"></dxi-item> 
                    <dxi-item itemType="button" horizontalAlignment="left" [buttonOptions]="buttonOptions"></dxi-item>
                  </dxi-item>
              
                </dx-form>
              </form>

            </dx-scroll-view>
        </div>
    </dx-popup>

     <dx-popup width="100%" height="100%" [showTitle]="true" title="Observaciones" [dragEnabled]="false" [closeOnOutsideClick]="true" [showCloseButton]="true" container=".dx-viewport" [(visible)]="modVerObs">
        <div *dxTemplate="let data of 'content'">
            <dx-scroll-view width="100%" height="100%">
                <br>
                <!-- <div id="exportContainer">
                  <dx-button text="EXPORTAR TODO" icon="xlsxfile" (onClick)="exportGrids($event)"></dx-button>
                </div>
                <br><br> -->
            <!-- [customizeExportData]="customizeExportData" -->
                <dx-data-grid #gridDetalleI id="gridContainer2" [dataSource]="observaciones" [height]="450" [showBorders]="true" [columnAutoWidth]="true"
                 (onRowPrepared)="onRowPreparedObs($event)" (onCellPrepared)="onCellPreparedObs($event)">
                    <dxo-scrolling mode="virtual" rowRenderingMode="virtual"></dxo-scrolling>
                    <dxo-paging [pageSize]="100"></dxo-paging>
                    <dxo-search-panel [visible]="true" [width]="240" placeholder="Buscar..."></dxo-search-panel>

                    <dxo-export [enabled]="true" fileName="Observaciones"></dxo-export>
                    
                    <dxi-column dataField="periodo" caption="" [groupIndex]="0"></dxi-column>
                    <dxi-column dataField="idusuario" caption="ID Usuario"></dxi-column> 
                    <dxi-column dataField="fecha" caption="Fecha" dataType="date" format="dd/MM/yyyy"></dxi-column>
                    <dxi-column dataField="observaciones" caption="Observaciones"></dxi-column>
                   

                    <!--*ngIf="groupValue !== '0.- INDICADORES' "  -->
                    <dxo-summary [calculateCustomSummary]="calcularPorcentajes">
                
                    </dxo-summary>

                </dx-data-grid>
            </dx-scroll-view>
        </div>
    </dx-popup>
    
    <!-- LOAD PANEL -->
    <dx-load-panel #loadPanel shadingColor="rgba(0,0,0,0.4)" [position]="{ of: '#rentCont2' }" [(visible)]="loadingVisible" [showIndicator]="true" [showPane]="true" [shading]="true" [closeOnOutsideClick]="false" (onShown)="onShown()" (onHidden)="onHidden()">
    </dx-load-panel>


    <dx-toast [(visible)]="isVisible" type="info" message="Seleccione Año y Mes">
        <dxo-position my="top" at="right" of="#container">
        </dxo-position>
    </dx-toast>
</div>
